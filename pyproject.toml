[project]
name = "showdown-agent"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [{ name = "drewlarso" }]
requires-python = ">=3.14"
dependencies = [
    "poke-env>=0.16.1",
]

[tool.maturin]
module-name = "agent._core"
python-packages = ["agent"]
python-source = "src"

[tool.uv]
cache-keys = [
    { file = "pyproject.toml" },
    { file = "src/**/*.rs" },
    { file = "Cargo.toml" },
    { file = "Cargo.lock" },
]

[build-system]
requires = ["maturin>=1.0,<2.0"]
build-backend = "maturin"

[dependency-groups]
dev = ["maturin>=1.0,<2.0", "ruff>=0.17.4"]

[tool.ruff]
line-length = 120
